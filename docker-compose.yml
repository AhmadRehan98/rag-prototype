services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag_prototype_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rag_prototype
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag_prototype"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag_prototype_quest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    # Local-only credentials, matching the postgres service above.
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/rag_prototype
      LLM_BASE_URL: http://llm:8080
    volumes:
      - .:/workspace

  llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: rag_prototype_llm
    restart: unless-stopped
    environment:
      LLAMA_CACHE: /models
      LLM_THREADS: ${LLM_THREADS:-}
    entrypoint: ["sh", "-c"]
    command:
      - >-
        exec /app/llama-server
        --hf-repo Qwen/Qwen2.5-3B-Instruct-GGUF
        --hf-file qwen2.5-3b-instruct-q4_k_m.gguf
        --ctx-size 8192
        --threads "$${LLM_THREADS:-$$(nproc)}"
        --host 0.0.0.0
        --port 8080
    ports:
      - "8080:8080"
    volumes:
      - llm_models:/models

volumes:
  postgres_data:
  llm_models:
