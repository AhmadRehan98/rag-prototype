[tool.poetry]
name = "rag-prototype-quest"
version = "2.5"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.135"
uvicorn = {extras = ["standard"], version = "^0.42.0"}
pydantic-settings = "^2.13"
sqlalchemy = {extras = ["asyncio"], version = "^2.0"}
asyncpg = "^0.29"
pgvector = "^0.3"
typer = {extras = ["all"], version = "^0.12"}
httpx = "^0.27"
torch = {version = "2.14.0+cpu", source = "pytorch-cpu"}
sentence-transformers = "^6.0"
alembic = "^1.13"
python-multipart = "^0.0.22"
psycopg2-binary = "^2.9.13"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-asyncio = "^0.23"
pytest-mock = "^3.14"

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
