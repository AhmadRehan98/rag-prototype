services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag_prototype_postgres_debug
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rag_prototype
    ports:
      - "5432:5432"
    volumes:
      - postgres_debug_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag_prototype"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_debug_data:
